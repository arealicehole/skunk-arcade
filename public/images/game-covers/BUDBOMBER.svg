<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1a1a1a"/>
  
  <!-- Drone body -->
  <ellipse cx="50" cy="60" rx="15" ry="10" fill="#444" stroke="#666" stroke-width="2"/>
  
  <!-- Drone propeller -->
  <rect x="20" y="70" width="6" height="10" fill="#666"/>
  
  <!-- Drone light -->
  <circle cx="50" cy="60" r="4" fill="#0F0"/>
  
  <!-- Seeds/bullets shooting -->
  <circle cx="65" cy="60" r="3" fill="#FF0" stroke="#333" stroke-width="1"/>
  <circle cx="70" cy="60" r="2" fill="#FF0" stroke="#333" stroke-width="1"/>
  <circle cx="75" cy="60" r="2" fill="#FF0" stroke="#333" stroke-width="1"/>
  
  <!-- Buds to collect -->
  <circle cx="35" cy="45" r="6" fill="#8B4513" stroke="#228B22" stroke-width="1"/>
  <circle cx="35" cy="55" r="6" fill="#8B4513" stroke="#228B22" stroke-width="1"/>
  <circle cx="25" cy="40" r="5" fill="#8B4513" stroke="#228B22" stroke-width="1"/>
  
  <!-- Fire hazard -->
  <circle cx="70" cy="40" r="15" fill="rgba(255,100,50,0.3)" stroke="#FF6633" stroke-width="1"/>
  
  <!-- Title text -->
  <text x="50" y="20" text-anchor="middle" fill="#0F0" font-family="monospace" font-size="10" font-weight="bold">BUD BOMBER</text>
  
  <!-- Tagline -->
  <text x="50" y="90" text-anchor="middle" fill="#666" font-family="monospace" font-size="6">SHOOT • COLLECT • SURVIVE</text>
</svg>